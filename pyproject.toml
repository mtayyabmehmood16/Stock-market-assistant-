[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-market-assistant"
version = "0.1.0"
description = "AI Stock Market Assistant with MCP integrations, isolated Python sandbox, Celery workers, and conversational charts UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.27.2",
    "mcp>=2.0.0",
    "yfinance>=0.2.48",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "services*", "packages*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "apps/api/tests",
    "services/mcp_market/tests",
    "services/mcp_research/tests",
    "services/sandbox/tests",
    "services/worker/tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
