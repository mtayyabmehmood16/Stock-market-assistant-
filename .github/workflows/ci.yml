name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check .
      - name: Run unit & integration tests
        env:
          CELERY_TASK_ALWAYS_EAGER: "true"
          MARKET_DATA_MODE: "fixture"
          SANDBOX_MODE: "local_restricted"
          LLM_PROVIDER: "mock"
        run: pytest -v

  sandbox-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated Python sandbox image
        run: docker build -f services/sandbox/Dockerfile.sandbox -t stock-assistant-sandbox:ci .

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck & build Next.js app
        run: |
          npx tsc --noEmit
          npm run build
